<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twibbon Maker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <div class="logo">Twibbon Maker</div>
        <div class="menu">
            <a href="#">Home</a>
            <a href="#">Features</a>
            <a href="#">Contact</a>
        </div>
        <div class="hamburger" id="hamburger">
            <div></div>
            <div></div>
            <div></div>
        </div>
        <div class="mobile-menu" id="mobileMenu">
            <button class="close-btn" id="closeMenu">&times;</button>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>
    </nav>

    <header>
        <h1>Buat Twibbon Kerenmu Sendiri</h1>
        <p>Upload fotomu, pilih desain, dan tampil beda di media sosial!</p>
    </header>


    <div class="container">
        <div class="upload-section">
            <!-- Template Selector -->
            <div class="template-selector">
                <label for="template">Pilih Desain Twibbon :</label>
                <select id="template">
                    <option value="twibbon1.png">Dirgahayu Indonesia 1</option>
                    <option value="twibbon2.png">Dirgahayu Indonesia 2</option>
                    <option value="mpls1.png">MPLS TK N 1 Pundong</option>
                    <!-- Tambahkan lebih banyak opsi sesuai kebutuhan -->
                </select>
            </div>
            <h1>Mulai Desain Twibbon</h1>
            <div class="file-input-container">
                <label for="upload">Unggah Fotomu</label>
                <input type="file" id="upload" accept="image/*">
            </div>
            <div class="canvas-container">
                <canvas id="canvas" width="800" height="800"></canvas>
            </div>
            <div class="slider-container">
                <label for="size">Sesuaikan Ukuran Foto :</label>
                <input type="range" id="size" min="10" max="200" value="100">
                <span id="sizeValue">100</span>%
            </div>
            <div class="button-group">
                <button class="btn" onclick="resetSize()">Reset Ukuran</button>
                <div class="download-options">
                    <label for="quality">Kualitas:</label>
                    <select id="quality">
                        <option value="0.5">Rendah</option>
                        <option value="1">Sedang</option>
                        <option value="2">Tinggi</option>
                        <option value="3">Super HD</option>
                    </select>
                    <button class="btn" onclick="downloadImage()">Unduh Twibbon</button>
                </div>
            </div>
        </div>
    </div>

    <a href="https://saweria.co/radenmanggala" class="floating-donate-modern" target="_blank"
        aria-label="Dukung saya di Saweria">
        <img src="https://img.icons8.com/ios-filled/50/fa314a/like.png" alt="Saweria" />
    </a>

    <footer>
        <p>&copy; 2024 Muhammad Syifa Surya Saputra. All rights reserved.</p>
    </footer>


    <script src="script.js"></script>
</body>

</html>
